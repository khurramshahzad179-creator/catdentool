<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cat Den — Poster Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --ink:#161428;
    --panel:#211E38;
    --cream:#FBF4E4;
    --gold:#F4B942;
    --coral:#F2694F;
    --muted:#B9B4CE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#242238;
    font-family:'Nunito',sans-serif;
    color:var(--cream);
  }

  .controls{
    position:sticky;
    top:0;
    z-index:50;
    background:#1B1930;
    border-bottom:1px solid rgba(255,255,255,0.08);
    padding:18px 28px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:16px;
  }
  .controls h2{
    font-family:'Baloo 2',sans-serif;
    font-size:22px;
    margin:0 24px 0 0;
    color:var(--gold);
  }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:12px; color:var(--muted); font-weight:700; }
  select, input[type=text], input[type=password], input[type=number]{
    font-family:'Nunito',sans-serif;
    font-size:14px;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.15);
    background:#2A2743;
    color:var(--cream);
    min-width:150px;
  }
  .btn{
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--ink);
    background:var(--gold);
    border:none;
    padding:10px 20px;
    border-radius:999px;
    cursor:pointer;
  }
  .btn:hover{ background:#f7c766; }
  .btn.secondary{
    background:transparent;
    color:var(--cream);
    border:1px solid rgba(255,255,255,0.25);
  }
  .btn.secondary:hover{ background:rgba(255,255,255,0.08); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .status{
    padding:10px 28px;
    font-size:14px;
    color:var(--muted);
  }
  .status.error{ color:#F2694F; }

  .grid{
    display:flex;
    flex-wrap:wrap;
    gap:26px;
    padding:26px 28px 60px;
  }
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    width:340px;
  }
  .stage .dl-btn{
    font-size:13px;
    padding:7px 16px;
  }
  .frame{
    width:340px;
    height:425px;
    overflow:hidden;
    border-radius:10px;
    background:#000;
  }
  .card{
    width:1080px;
    height:1350px;
    transform:scale(0.3148);
    transform-origin:top left;
    background:#000;
    color:var(--cream);
    position:relative;
    overflow:hidden;
  }
  .card img{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }
  .scrim-top{
    position:absolute; left:0; right:0; top:0; height:340px;
    background:linear-gradient(180deg, rgba(10,9,18,0.75) 0%, rgba(10,9,18,0) 100%);
  }
  .scrim-bottom{
    position:absolute; left:0; right:0; bottom:0; height:560px;
    background:linear-gradient(180deg, rgba(10,9,18,0) 0%, rgba(10,9,18,0.92) 55%, rgba(10,9,18,0.98) 100%);
  }
  .tag{
    position:absolute;
    top:48px; left:56px;
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:24px;
    color:var(--gold);
    letter-spacing:0.2px;
  }
  .tag .dot{ width:9px;height:9px;border-radius:50%;background:var(--coral); }
  h1.hook{
    position:absolute;
    left:56px; right:56px; bottom:70px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:70px;
    line-height:1.1;
    margin:0;
    color:var(--cream);
    text-shadow:0 2px 18px rgba(0,0,0,0.35);
    outline:none;
  }

  h1.hook[contenteditable="true"]:focus{
    box-shadow:0 0 0 3px rgba(244,185,66,0.9);
    border-radius:8px;
  }
  .stage .actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .stage .actions .btn{
    font-size:12px;
    padding:6px 14px;
  }

    font-size:11px;
    color:var(--muted);
    text-align:center;
  }
  .caption-box{
    width:340px;
    background:#1B1930;
    border-radius:10px;
    padding:10px 12px;
    font-size:12px;
    color:var(--muted);
    line-height:1.4;
    max-height:70px;
    overflow:auto;
  }
  .empty{
    padding:60px 28px;
    text-align:center;
    color:var(--muted);
    font-size:15px;
  }
</style>
</head>
<body>

<div class="controls">
  <h2>Cat Den poster generator</h2>

  <div class="field">
    <label for="source">Photo source</label>
    <select id="source">
      <option value="pixabay">Pixabay</option>
      <option value="pexels">Pexels</option>
    </select>
  </div>

  <div class="field">
    <label for="apikey">API key</label>
    <input type="password" id="apikey" placeholder="Paste your API key">
  </div>

  <div class="field">
    <label for="pagename">Page name</label>
    <input type="text" id="pagename" value="Cat Den">
  </div>

  <div class="field">
    <label for="batchsize">Batch size</label>
    <input type="number" id="batchsize" value="12" min="1" max="30">
  </div>

  <button class="btn" id="generateBtn">Generate batch</button>
  <button class="btn secondary" id="downloadAllBtn">Download all as ZIP</button>
  <button class="btn secondary" id="clearBtn">Clear all</button>
</div>

<div class="status" id="status">Paste your Pixabay or Pexels API key above, then click "Generate batch". Your key is saved in this browser for next time. Click any headline on a poster to edit it, and use "Change photo" to swap just the image while keeping the same caption.</div>

<div class="grid" id="grid"></div>

const QUERIES_PIXABAY = ["cat","kitten","cat portrait","cat face","sleeping cat","cute cat","tabby cat","black cat","orange cat","cat playing","cat outdoors","cat closeup","fluffy cat","cat eyes","cat whiskers"];
const QUERIES_PEXELS = ["cat","kitten","cat portrait","cat face","sleeping cat","cute cat","tabby cat","black cat","orange cat","cat playing","cat outdoors","fluffy cat","cat eyes"];

function loadJSON(key, fallback){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

let usedFactIdx = loadJSON('catden_used_facts', []);
let usedPhotoIds = loadJSON('catden_used_photos', []);

const apiKeyInput = document.getElementById('apikey');
const sourceSelect = document.getElementById('source');
const pageNameInput = document.getElementById('pagename');
const statusEl = document.getElementById('status');
const grid = document.getElementById('grid');

apiKeyInput.value = localStorage.getItem('catden_apikey') || '';
sourceSelect.value = localStorage.getItem('catden_source') || 'pixabay';
pageNameInput.value = localStorage.getItem('catden_pagename') || 'Cat Den';
apiKeyInput.addEventListener('change', ()=> localStorage.setItem('catden_apikey', apiKeyInput.value));
sourceSelect.addEventListener('change', ()=> localStorage.setItem('catden_source', sourceSelect.value));
pageNameInput.addEventListener('change', ()=> localStorage.setItem('catden_pagename', pageNameInput.value));

function setStatus(msg, isError){
  statusEl.textContent = msg;
  statusEl.className = 'status' + (isError ? ' error' : '');
}

function pickFacts(n){
  let pool = FACTS.map((f,i)=>i).filter(i => !usedFactIdx.includes(i));
  if(pool.length < n){
    usedFactIdx = [];
    pool = FACTS.map((f,i)=>i);
  }
  const chosen = [];
  for(let k=0;k<n && pool.length>0;k++){
    const r = Math.floor(Math.random()*pool.length);
    const idx = pool.splice(r,1)[0];
    chosen.push(idx);
    usedFactIdx.push(idx);
  }
  saveJSON('catden_used_facts', usedFactIdx);
  return chosen.map(i => FACTS[i]);
}

async function fetchPixabayPhoto(key){
  for(let attempt=0; attempt<6; attempt++){
    const q = QUERIES_PIXABAY[Math.floor(Math.random()*QUERIES_PIXABAY.length)];
    const page = 1 + Math.floor(Math.random()*25);
    const url = `https://pixabay.com/api/?key=${encodeURIComponent(key)}&q=${encodeURIComponent(q)}&image_type=photo&orientation=vertical&safesearch=true&per_page=20&page=${page}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('Pixabay request failed: ' + res.status);
    const data = await res.json();
    const hits = (data.hits || []).filter(h => !usedPhotoIds.includes('px_'+h.id));
    if(hits.length > 0){
      const pick = hits[Math.floor(Math.random()*hits.length)];
      usedPhotoIds.push('px_'+pick.id);
      saveJSON('catden_used_photos', usedPhotoIds);
      return { url: pick.largeImageURL || pick.webformatURL, credit: pick.user, id: 'px_'+pick.id };
    }
  }
  throw new Error('Could not find a fresh Pixabay photo, try again');
}

async function fetchPexelsPhoto(key){
  for(let attempt=0; attempt<6; attempt++){
    const q = QUERIES_PEXELS[Math.floor(Math.random()*QUERIES_PEXELS.length)];
    const page = 1 + Math.floor(Math.random()*25);
    const url = `https://api.pexels.com/v1/search?query=${encodeURIComponent(q)}&per_page=20&page=${page}&orientation=portrait`;
    const res = await fetch(url, { headers: { Authorization: key } });
    if(!res.ok) throw new Error('Pexels request failed: ' + res.status);
    const data = await res.json();
    const hits = (data.photos || []).filter(p => !usedPhotoIds.includes('pe_'+p.id));
    if(hits.length > 0){
      const pick = hits[Math.floor(Math.random()*hits.length)];
      usedPhotoIds.push('pe_'+pick.id);
      saveJSON('catden_used_photos', usedPhotoIds);
      return { url: pick.src.large2x || pick.src.large, credit: pick.photographer, id: 'pe_'+pick.id };
    }
  }
  throw new Error('Could not find a fresh Pexels photo, try again');
}

function buildCard(photoUrl, factText, pageName, cardId){
  const stage = document.createElement('div');
  stage.className = 'stage';
  stage.dataset.source = sourceSelect.value;

  const actions = document.createElement('div');
  actions.className = 'actions';

  const dlBtn = document.createElement('button');
  dlBtn.className = 'btn dl-btn';
  dlBtn.textContent = 'Download PNG';
  dlBtn.onclick = () => downloadCard(cardId, dlBtn);

  const photoBtn = document.createElement('button');
  photoBtn.className = 'btn secondary';
  photoBtn.textContent = 'Change photo';
  photoBtn.onclick = () => changePhoto(cardId, stage.dataset.source, photoBtn);

  actions.appendChild(dlBtn);
  actions.appendChild(photoBtn);

  const frame = document.createElement('div');
  frame.className = 'frame';

  const card = document.createElement('div');
  card.className = 'card';
  card.id = cardId;
  card.innerHTML = `
    <img crossorigin="anonymous" src="${photoUrl}" alt="Cat photo">
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>
    <div class="tag"><span class="dot"></span>${pageName}</div>
    <h1 class="hook" contenteditable="true" spellcheck="false">${factText}</h1>
  `;

  frame.appendChild(card);
  stage.appendChild(actions);
  stage.appendChild(frame);

  const hint = document.createElement('div');
  hint.className = 'edit-hint';
  hint.textContent = 'Click the headline above to edit it';
  stage.appendChild(hint);

  const cap = document.createElement('div');
  cap.className = 'caption-box';
  cap.textContent = factText;
  stage.appendChild(cap);

  const hookEl = card.querySelector('.hook');
  hookEl.addEventListener('input', () => {
    cap.textContent = hookEl.textContent;
  });

  return stage;
}

async function changePhoto(cardId, source, btnEl){
  const key = apiKeyInput.value.trim();
  if(!key){ setStatus('Enter your API key first.', true); return; }
  const el = document.getElementById(cardId);
  const img = el.querySelector('img');
  btnEl.disabled = true;
  const origLabel = btnEl.textContent;
  btnEl.textContent = 'Swapping...';
  try{
    const photo = source === 'pixabay' ? await fetchPixabayPhoto(key) : await fetchPexelsPhoto(key);
    img.src = photo.url;
  }catch(e){
    console.error(e);
    setStatus('Could not fetch a new photo — check your API key or try again.', true);
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = origLabel;
  }
}

async function downloadCard(cardId, btnEl){
  const el = document.getElementById(cardId);
  if(document.activeElement) document.activeElement.blur();
  const orig = el.style.transform;
  el.style.transform = 'none';
  if(btnEl){ btnEl.disabled = true; btnEl.textContent = 'Rendering...'; }
  try{
    const canvas = await html2canvas(el, { backgroundColor:null, width:1080, height:1350, scale:2, useCORS:true });
    el.style.transform = orig;
    const link = document.createElement('a');
    link.download = cardId + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } finally {
    el.style.transform = orig;
    if(btnEl){ btnEl.disabled = false; btnEl.textContent = 'Download PNG'; }
  }
}

let cardCounter = 0;

document.getElementById('generateBtn').addEventListener('click', async () => {
  const key = apiKeyInput.value.trim();
  const source = sourceSelect.value;
  const pageName = pageNameInput.value.trim() || 'Cat Den';
  const n = Math.max(1, Math.min(30, parseInt(document.getElementById('batchsize').value) || 12));

  if(!key){
    setStatus('Enter your Pixabay or Pexels API key first.', true);
    return;
  }
  localStorage.setItem('catden_apikey', key);
  localStorage.setItem('catden_source', source);
  localStorage.setItem('catden_pagename', pageName);

  const genBtn = document.getElementById('generateBtn');
  genBtn.disabled = true;
  setStatus('Fetching ' + n + ' fresh cat photos and pairing them with facts...');

  const facts = pickFacts(n);
  let made = 0, failed = 0;

  for(let i=0;i<n;i++){
    try{
      const photo = source === 'pixabay' ? await fetchPixabayPhoto(key) : await fetchPexelsPhoto(key);
      cardCounter++;
      const cardId = 'card_' + Date.now() + '_' + cardCounter;
      const el = buildCard(photo.url, facts[i], pageName, cardId);
      grid.appendChild(el);
      made++;
    }catch(e){
      failed++;
      console.error(e);
    }
    setStatus(`Generated ${made} of ${n}` + (failed ? `, ${failed} failed` : '') + '...');
  }

  genBtn.disabled = false;
  setStatus(`Done. Added ${made} new poster${made===1?'':'s'}${failed ? `, ${failed} failed (check your API key or rate limit)` : ''}. Click "Generate batch" again for more, or "Download all as ZIP".`, failed>0 && made===0);
});

document.getElementById('downloadAllBtn').addEventListener('click', async () => {
  const cards = grid.querySelectorAll('.card');
  if(cards.length === 0){ setStatus('Nothing to download yet, generate a batch first.', true); return; }
  setStatus('Rendering ' + cards.length + ' posters into a ZIP, this can take a moment...');
  const zip = new JSZip();
  let i = 0;
  if(document.activeElement) document.activeElement.blur();
  for(const el of cards){
    i++;
    const orig = el.style.transform;
    el.style.transform = 'none';
    const canvas = await html2canvas(el, { backgroundColor:null, width:1080, height:1350, scale:2, useCORS:true });
    el.style.transform = orig;
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    zip.file('cat-den-post-' + i + '.png', blob);
    setStatus('Rendered ' + i + ' of ' + cards.length + '...');
  }
  const content = await zip.generateAsync({type:'blob'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(content);
  link.download = 'cat-den-posts.zip';
  link.click();
  setStatus('ZIP downloaded with ' + cards.length + ' posters.');
});

document.getElementById('clearBtn').addEventListener('click', () => {
  grid.innerHTML = '';
  setStatus('Cleared the current batch. Your fact and photo history is still remembered, so future batches keep staying fresh.');
});
</script>
</body>
</html>
